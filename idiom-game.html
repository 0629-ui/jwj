<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6fc1ff">
<title>成语选释义 · 小游戏乐园</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#cfefff;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:linear-gradient(170deg,#6fc1ff 0%,#cfefff 42%,#c9f0cf 100%);
    color:#123;
    user-select:none;-webkit-user-select:none;
  }
  /* ===== 全屏等比缩放画布：与「拼音接金币」同一套适配方案 ===== */
  #viewport{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;
  }
  #app{
    position:relative;flex:0 0 auto;
    width:480px;min-height:860px;
    padding:12px 14px 14px;
    display:flex;flex-direction:column;gap:10px;
    transform-origin:center center;
    will-change:transform;
  }

  /* ============ 顶部状态栏 ============ */
  .hud{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:36px;height:36px;flex:0 0 36px;border:none;border-radius:50%;
    background:rgba(255,255,255,.85);color:#0f4c81;font-size:22px;font-weight:900;
    line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(15,76,129,.18);
    display:flex;align-items:center;justify-content:center;padding-bottom:3px;
  }
  .icon-btn:active{transform:scale(.94);}
  .hud-mid{flex:1;min-width:0;}
  .hud-mid .t{font-size:16px;font-weight:900;color:#0f4c81;letter-spacing:1px;}
  .hud-mid .q{font-size:12px;color:#3f7ba8;margin-top:1px;}
  .counters{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .row-icons{font-size:15px;letter-spacing:1px;line-height:1.15;white-space:nowrap;}

  /* ============ 成语题面 ============ */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;min-height:0;}
  .card{
    background:linear-gradient(160deg,#ffffff 0%,#f2f9ff 100%);
    border:3px solid #fff;border-radius:24px;
    box-shadow:0 8px 22px rgba(15,76,129,.16);
    padding:18px 16px;text-align:center;
  }
  .card .ask{font-size:13px;color:#5b87ab;letter-spacing:1px;}
  .card .idiom{
    margin-top:10px;font-size:44px;font-weight:900;color:#0f4c81;letter-spacing:6px;
    text-shadow:0 3px 0 rgba(111,193,255,.28);line-height:1.2;word-break:break-all;
  }
  .card .hint{margin-top:8px;font-size:12px;color:#7ba3c2;}

  /* ============ 选项 ============ */
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    position:relative;display:flex;align-items:center;gap:10px;width:100%;
    background:#fff;border:3px solid #d8ecfb;border-radius:18px;
    padding:13px 14px;text-align:left;font-size:15px;line-height:1.5;color:#1d3b52;
    font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #cfe4f5;
    transition:border-color .15s,background .15s,transform .08s,box-shadow .08s;
  }
  .opt:active:not(.locked){transform:translateY(2px);box-shadow:0 2px 0 #cfe4f5;}
  .opt .k{
    flex:0 0 26px;height:26px;border-radius:50%;background:#eaf5ff;color:#3d7fb0;
    font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .opt.ok{background:#e8fff0;border-color:#4ecb71;box-shadow:0 4px 0 #a9e8bd;}
  .opt.ok .k{background:#4ecb71;color:#fff;}
  .opt.bad{background:#fff0f0;border-color:#ff7b7b;box-shadow:0 4px 0 #ffc4c4;}
  .opt.bad .k{background:#ff7b7b;color:#fff;}
  .opt .mark{position:absolute;right:12px;font-size:18px;}
  .opt.locked{cursor:default;}

  /* ============ 解析 / 结算 弹层 ============ */
  .mask{
    position:absolute;inset:0;background:rgba(12,45,72,.42);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:20;
  }
  .mask.show{display:flex;}
  .panel{
    width:100%;max-width:400px;background:#fff;border-radius:24px;
    padding:20px 18px;box-shadow:0 18px 40px rgba(8,40,65,.34);
    animation:pop .22s ease-out;overflow:hidden;
  }
  @keyframes pop{from{transform:scale(.86);opacity:0;}to{transform:scale(1);opacity:1;}}
  .panel h2{font-size:20px;color:#0f4c81;text-align:center;letter-spacing:1px;}
  .panel .sub{text-align:center;font-size:13px;color:#6b93b2;margin-top:6px;}
  .sol-idiom{
    margin:14px 0 10px;text-align:center;font-size:30px;font-weight:900;
    color:#e05a2b;letter-spacing:4px;
  }
  .sol-box{background:#f4fbff;border:2px dashed #b9dcf5;border-radius:16px;padding:12px 14px;}
  .sol-box .lb{font-size:12px;font-weight:900;color:#2f8f5b;letter-spacing:1px;}
  .sol-box .tx{font-size:15px;color:#1d3b52;line-height:1.6;margin-top:4px;}
  .sol-box.warn{background:#fff8f2;border-color:#ffd6b0;margin-top:10px;}
  .sol-box.warn .lb{color:#d97a1a;}
  .stars-big{text-align:center;font-size:34px;letter-spacing:6px;margin:12px 0 4px;}
  .recap{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .recap .it{
    background:#f7fbff;border-left:5px solid #7fc4ef;border-radius:10px;padding:9px 11px;
  }
  .recap .it.miss{background:#fff5f5;border-left-color:#ff9a9a;}
  .recap .it .w{font-size:15px;font-weight:900;color:#0f4c81;letter-spacing:1px;}
  .recap .it .w em{font-style:normal;font-size:12px;color:#8ab0cb;font-weight:400;margin-left:6px;}
  .recap .it .d{font-size:13px;color:#3f6a8a;margin-top:3px;line-height:1.5;}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .btn{
    border:none;border-radius:40px;padding:14px 18px;font-size:17px;font-weight:900;
    font-family:inherit;letter-spacing:1px;cursor:pointer;
  }
  .btn.primary{background:linear-gradient(135deg,#ffd166,#ff9a1f);color:#6b3200;box-shadow:0 5px 0 #d98b00;}
  .btn.ghost{background:#eef7ff;color:#2c6f9e;box-shadow:0 5px 0 #cde4f5;}
  .btn:active{transform:translateY(3px);box-shadow:none;}

  /* 星星动效 */
  .fly{position:absolute;font-size:26px;pointer-events:none;z-index:30;animation:fly .85s ease-out forwards;}
  @keyframes fly{
    0%{opacity:1;transform:translate(0,0) scale(.7);}
    100%{opacity:0;transform:translate(0,-110px) scale(1.5);}
  }
  .shake{animation:shake .32s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}75%{transform:translateX(-4px);}
  }
</style>
</head>
<body>
<div id="viewport">
<div id="app">
  <div class="hud">
    <button class="icon-btn" id="btnBack" aria-label="返回">‹</button>
    <div class="hud-mid">
      <div class="t">成语选释义</div>
      <div class="q" id="qidx">第 1 / 3 题</div>
    </div>
    <div class="counters">
      <div class="row-icons" id="hudStars">⭐️⭐️⭐️</div>
      <div class="row-icons" id="hudHearts">❤️❤️❤️</div>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="ask">选出画线成语的正确意思</div>
      <div class="idiom" id="idiom">——</div>
      <div class="hint">点一下你认为对的那个</div>
    </div>
    <div class="options" id="options"></div>
  </div>

  <div class="mask" id="mask">
    <!-- 解析 -->
    <div class="panel" id="solPanel" style="display:none">
      <h2 id="solTitle">差一点点！</h2>
      <div class="sol-idiom" id="solIdiom">—</div>
      <div class="sol-box">
        <div class="lb">✔ 正确释义</div>
        <div class="tx" id="solCorrect">—</div>
      </div>
      <div class="sol-box warn" id="solWarnBox">
        <div class="lb">✘ 常见误解</div>
        <div class="tx" id="solWrong">—</div>
      </div>
      <div class="btns">
        <button class="btn primary" id="btnNext">下一题 ▶</button>
      </div>
    </div>
    <!-- 结算 -->
    <div class="panel" id="endPanel" style="display:none">
      <h2 id="endTitle">—</h2>
      <div class="sub" id="endSub">—</div>
      <div class="stars-big" id="endStars">⭐️⭐️⭐️</div>
      <div class="recap" id="recap"></div>
      <div class="btns">
        <button class="btn primary" id="btnAgain">🔁 再来一局</button>
        <button class="btn ghost" id="btnQuit">🏠 退出</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const IDIOM_BANK = [{"idiom":"安土重迁","correct":"留恋故土，不肯轻易迁移","wrong":"喜欢并重视搬家迁移","group":"望文生义"},{"idiom":"安步当车","correct":"慢慢地步行，就当作是坐车","wrong":"走路快得像坐车一样","group":"望文生义"},{"idiom":"别无长物","correct":"除一身之外没有多余的东西，形容穷困或俭朴","wrong":"没有什么长处和本事","group":"望文生义"},{"idiom":"白驹过隙","correct":"形容时间过得飞快","wrong":"白马跑得很快，形容马速快","group":"望文生义"},{"idiom":"不刊之论","correct":"不能改动或不可磨灭的言论","wrong":"水平太低，不可以刊登的文章","group":"望文生义"},{"idiom":"不易之论","correct":"内容正确、不可更改的言论","wrong":"很不容易理解的高深言论","group":"望文生义"},{"idiom":"不名一文","correct":"一个钱也没有，形容极度贫穷","wrong":"一文钱都不值，形容没价值","group":"望文生义"},{"idiom":"不足为训","correct":"不能当作典范或法则","wrong":"不值得吸取的教训","group":"望文生义"},{"idiom":"侧目而视","correct":"心存畏惧不敢正视，斜着眼睛看","wrong":"不屑一顾，轻蔑地看待","group":"望文生义"},{"idiom":"曾几何时","correct":"时间过去没有多久","wrong":"时间已经过去很久了","group":"望文生义"},{"idiom":"差强人意","correct":"大体上还能使人满意","wrong":"很差劲，不能使人满意","group":"望文生义"},{"idiom":"尘埃落定","correct":"比喻事情有了结局或结果","wrong":"灰尘终于落到了地面","group":"望文生义"},{"idiom":"春意阑珊","correct":"指春天将尽","wrong":"春天的景象很美好","group":"望文生义"},{"idiom":"大方之家","correct":"指见识广博、懂事理的人","wrong":"不吝啬、出手大方的人","group":"望文生义"},{"idiom":"登高自卑","correct":"登山要从底下开始，比喻事情循序进行","wrong":"登上高山以后感到很自卑","group":"望文生义"},{"idiom":"登堂入室","correct":"比喻学问或技能由浅入深，达到更高水平","wrong":"走进房间里，形容进屋","group":"望文生义"},{"idiom":"反戈一击","correct":"掉转头来反对自己原来所属的一方","wrong":"反败为胜，扭转局面","group":"望文生义"},{"idiom":"犯而不校","correct":"对别人的冒犯不加计较","wrong":"犯了错误却不改正","group":"望文生义"},{"idiom":"瓜田李下","correct":"泛指容易引起嫌疑的地方","wrong":"形容田园风光很美好","group":"望文生义"},{"idiom":"毫厘不爽","correct":"形容丝毫不差","wrong":"心里很不爽快，非常郁闷","group":"望文生义"},{"idiom":"河东狮吼","correct":"比喻嫉妒而泼悍的妻子发怒撒泼","wrong":"形容吼叫声很大","group":"望文生义"},{"idiom":"呼之欲出","correct":"形容人物描写生动逼真，也指某事即将揭晓","wrong":"叫他一声他就会出来","group":"望文生义"},{"idiom":"涣然冰释","correct":"比喻疑虑、误会一下子消除","wrong":"冰雪融化，天气转暖","group":"望文生义"},{"idiom":"见微知著","correct":"见到一点儿苗头就能知道问题的实质","wrong":"只看到微小的事物","group":"望文生义"},{"idiom":"江河日下","correct":"比喻情况一天天坏下去","wrong":"江水一天天向下游流淌","group":"望文生义"},{"idiom":"久假不归","correct":"长期借去不归还"," "形容诗文、书画、歌唱等自然流畅","wrong":"形容云水流动的自然景色","group":"对象误用"},{"idiom":"摇旗呐喊","correct":"泛指替别人助长声势","wrong":"在战场上摇旗大喊，冲锋陷阵","group":"对象误用"},{"idiom":"一挥而就","correct":"指写字、写文章、绘画很快就完成","wrong":"一挥手就成功，形容很轻松","group":"对象误用"},{"idiom":"倚马可待","correct":"形容文思敏捷，写文章快","wrong":"站在马旁等待，形容等候时间短","group":"对象误用"},{"idiom":"雨后春笋","correct":"比喻新事物大量出现","wrong":"形容春天雨后的景色很美","group":"对象误用"},{"idiom":"崭露头角","correct":"比喻突出地显露出才能和本领（多指青少年）","wrong":"露出头角，形容刚刚出现","group":"对象误用"},{"idiom":"振聋发聩","correct":"比喻用语言文字唤醒糊涂的人","wrong":"声音很大，把耳朵都震聋了","group":"对象误用"},{"idiom":"炙手可热","correct":"形容气焰很盛，权势很大","wrong":"东西很烫手，形容热销抢手","group":"对象误用"},{"idiom":"栉风沐雨","correct":"形容奔波劳碌，不避风雨","wrong":"用风梳头用雨洗头，爱干净","group":"对象误用"}];
const HOME_URL = "index.html";
const ROUND_SIZE = 3, MAX_STAR = 3, MAX_HEART = 3;
const VW = 480, VH = 860;   /* 逻辑画布尺寸，与「拼音接金币」一致 */

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- 音效 ---------- */
let AC = null;
function beep(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = type === "ok" ? [[740, 0], [988, .09], [1319, .18]]
             : type === "bad" ? [[300, 0], [200, .12]]
             : [[659, 0], [784, .1], [988, .2], [1319, .3]];
    seq.forEach(([f, t]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === "bad" ? "sawtooth" : "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, AC.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.16, AC.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + t + .22);
      o.connect(g).connect(AC.destination);
      o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .26);
    });
  } catch (e) {}
}

/* ---------- 抽题池：全局洗牌，不重复 ---------- */
let POOL = [];
function drawItem() {
  if (!POOL.length) POOL = shuffle(IDIOM_BANK.slice());
  return POOL.pop();
}

/* ---------- 组题：正确释义 + 本题典型误解 + 同组干扰项 ---------- */
function buildQuestion(item) {
  const others = shuffle(IDIOM_BANK.filter(x => x.group === item.group && x.idiom !== item.idiom));
  let third = null;
  for (const o of others) {
    if (o.wrong && o.wrong !== item.correct && o.wrong !== item.wrong) { third = o.wrong; break; }
  }
  if (!third) third = "形容事物的样子完全改变了";
  const opts = shuffle([
    { text: item.correct, ok: true },
    { text: item.wrong, ok: false },
    { text: third, ok: false }
  ]);
  return { item, opts };
}

/* ---------- 状态 ---------- */
let S = { stars: 0, hearts: MAX_HEART, idx: 0, qs: [], cur: null, locked: false, log: [] };

const hudStars = () => "⭐️".repeat(S.stars) + "☆".repeat(Math.max(0, MAX_STAR - S.stars));
const hudHearts = () => "❤️".repeat(S.hearts) + "🤍".repeat(Math.max(0, MAX_HEART - S.hearts));

function renderHUD() {
  $("hudStars").textContent = hudStars();
  $("hudHearts").textContent = hudHearts();
  $("qidx").textContent = "第 " + Math.min(S.idx + 1, ROUND_SIZE) + " / " + ROUND_SIZE + " 题";
}

/* ---------- 渲染题目 ---------- */
function renderQuestion() {
  S.locked = false;
  S.cur = S.qs[S.idx];
  $("idiom").textContent = S.cur.item.idiom;
  const box = $("options");
  box.innerHTML = "";
  ["A", "B", "C"].forEach((k, i) => {
    const o = S.cur.opts[i];
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="k">' + k + "</span><span class=\"tx\"></span>";
    b.querySelector(".tx").textContent = o.text;
    b.addEventListener("click", () => pick(i, b));
    box.appendChild(b);
  });
  renderHUD();
}

/* ---------- 作答 ---------- */
function pick(i, btn) {
  if (S.locked) return;
  S.locked = true;
  const opt = S.cur.opts[i];
  document.querySelectorAll(".opt").forEach(b => b.classList.add("locked"));
  const item = S.cur.item;

  if (opt.ok) {
    btn.classList.add("ok");
    btn.insertAdjacentHTML("beforeend", '<span class="mark">✔</span>');
    S.stars++;
    S.log.push({ idiom: item.idiom, correct: item.correct, miss: false });
    renderHUD();
    flyStar(btn);
    beep("ok");
    setTimeout(() => advance(), 850);
  } else {
    btn.classList.add("bad");
    btn.classList.add("shake");
    btn.insertAdjacentHTML("beforeend", '<span class="mark">✘</span>');
    const right = [...document.querySelectorAll(".opt")].find(b => S.cur.opts[[...document.querySelectorAll(".opt")].indexOf(b)].ok);
    if (right) { right.classList.add("ok"); right.insertAdjacentHTML("beforeend", '<span class="mark">✔</span>'); }
    S.hearts--;
    S.log.push({ idiom: item.idiom, correct: item.correct, miss: true });
    renderHUD();
    beep("bad");
    setTimeout(() => showSolution(), 420);
  }
}

function flyStar(anchor) {
  const app = $("app");
  const r = anchor.getBoundingClientRect();
  const ar = app.getBoundingClientRect();
  const k = ar.width / (app.offsetWidth || VW);   /* 画布缩放比，换算回未缩放坐标系 */
  const s = document.createElement("div");
  s.className = "fly";
  s.textContent = "⭐️";
  s.style.left = ((r.left - ar.left) / k + r.width / k / 2 - 13) + "px";
  s.style.top = ((r.top - ar.top) / k - 6) + "px";
  app.appendChild(s);
  setTimeout(() => s.remove(), 900);
}

/* ---------- 解析弹层 ---------- */
function showSolution() {
  const it = S.cur.item;
  $("solIdiom").textContent = it.idiom;
  $("solCorrect").textContent = it.correct;
  $("solWrong").textContent = it.wrong || "—";
  $("solTitle").textContent = S.hearts <= 0 ? "爱心用完啦" : "差一点点！";
  $("btnNext").textContent = (S.hearts <= 0 || S.idx + 1 >= ROUND_SIZE) ? "看看结果 ▶" : "下一题 ▶";
  $("mask").classList.add("show");
  $("solPanel").style.display = "block";
  $("endPanel").style.display = "none";
  fit();
}

function advance() {
  S.idx++;
  if (S.hearts <= 0) return finish();
  if (S.idx >= ROUND_SIZE) return finish();
  renderQuestion();
}

/* ---------- 结算 ---------- */
function finish() {
  $("mask").classList.add("show");
  $("solPanel").style.display = "none";
  $("endPanel").style.display = "block";
  const st = S.stars, miss = S.log.filter(x => x.miss).length;
  let title, sub;
  if (st >= 3) { title = "🏆 完美通关！"; sub = "三题全对，三颗星全拿到啦"; }
  else if (st === 2) { title = "🎉 通关成功！"; sub = "就差一点点，可以更棒哦"; }
  else if (st === 1) { title = "💪 再练一练～"; sub = "记住刚才的解析，下一局会更好"; }
  else { title = "😢 挑战失败"; sub = "三颗爱心用完啦，再来一局吧"; }
  if (st < 3 && miss >= 3) sub = "三颗爱心用完啦，再来一局吧";
  $("endTitle").textContent = title;
  $("endSub").textContent = sub;
  $("endStars").textContent = hudStars();
  const box = $("recap");
  box.innerHTML = "";
  S.log.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "it" + (it.miss ? " miss" : "");
    const w = document.createElement("div");
    w.className = "w";
    w.textContent = it.idiom;
    const em = document.createElement("em");
    em.textContent = it.miss ? "答错了" : "答对了";
    w.appendChild(em);
    const t = document.createElement("div");
    t.className = "d";
    t.textContent = "✔ " + it.correct;
    d.appendChild(w); d.appendChild(t);
    box.appendChild(d);
  });
  beep(st >= 2 ? "win" : "bad");
  fit();
}

/* ---------- 开局 ---------- */
function newRound() {
  S = { stars: 0, hearts: MAX_HEART, idx: 0, qs: [], cur: null, locked: false, log: [] };
  for (let i = 0; i < ROUND_SIZE; i++) S.qs.push(buildQuestion(drawItem()));
  $("mask").classList.remove("show");
  renderQuestion();
  fit();
}

/* ---------- 事件 ---------- */
$("btnNext").addEventListener("click", () => {
  $("mask").classList.remove("show");
  advance();
});
$("btnAgain").addEventListener("click", newRound);
$("btnQuit").addEventListener("click", () => { location.href = HOME_URL; });
$("btnBack").addEventListener("click", () => { location.href = HOME_URL; });

document.addEventListener("keydown", e => {
  if ($("mask").classList.contains("show")) {
    if (e.key === "Enter") { ($("endPanel").style.display === "block") ? newRound() : $("btnNext").click(); }
    return;
  }
  const i = "123abcABC".indexOf(e.key);
  const map = { "1": 0, "a": 0, "A": 0, "2": 1, "b": 1, "B": 1, "3": 2, "c": 2, "C": 2 };
  if (map[e.key] !== undefined) {
    const b = document.querySelectorAll(".opt")[map[e.key]];
    if (b) b.click();
  }
});

/* ---------- 全屏适配：整页等比缩放居中，永不滚动、永不截断 ---------- */
function fit() {
  const app = $("app");
  const vw = window.innerWidth, vh = window.innerHeight;
  /* 面板内容若偏长，也一并纳入，保证弹层四周留白、绝不裁切 */
  let panelNeed = 0;
  ["solPanel", "endPanel"].forEach(id => {
    const p = $(id);
    if (p && p.style.display !== "none") panelNeed = Math.max(panelNeed, p.offsetHeight + 44);
  });
  const needH = Math.max(VH, app.scrollHeight, panelNeed);
  const s = Math.min(vw / VW, vh / needH);
  app.style.transform = "scale(" + s + ")";
}

newRound();

/* 锁死滚动：整页不产生任何上滑下滑 */
$("viewport").addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 120));
document.addEventListener("DOMContentLoaded", fit);
fit();
setTimeout(fit, 60);
</script>
