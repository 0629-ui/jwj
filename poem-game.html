<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7c873">
<title>古诗文默写 · 小游戏乐园</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",serif;
    background:linear-gradient(170deg,#f7c873 0%,#ffe9c2 46%,#d9f0d0 100%);
    color:#3b2a10;user-select:none;-webkit-user-select:none;
  }
  /* ===== 全屏等比缩放画布（与拼音接金币/成语选释义同一套） ===== */
  #viewport{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;
  }
  #app{
    position:relative;flex:0 0 auto;
    width:480px;min-height:860px;
    padding:12px 14px 14px;
    display:flex;flex-direction:column;gap:10px;
    transform-origin:center center;will-change:transform;
  }

  /* ============ 顶部状态栏 ============ */
  .hud{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:36px;height:36px;flex:0 0 36px;border:none;border-radius:50%;
    background:rgba(255,255,255,.9);color:#8a5a12;font-size:22px;font-weight:900;
    line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(120,80,20,.18);
    display:flex;align-items:center;justify-content:center;padding-bottom:3px;
  }
  .icon-btn:active{transform:scale(.94);}
  .hud-mid{flex:1;min-width:0;}
  .hud-mid .t{font-size:17px;font-weight:900;color:#7a4e0b;letter-spacing:2px;}
  .hud-mid .q{font-size:12px;color:#9a7740;margin-top:1px;}
  .counters{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .row-icons{font-size:15px;letter-spacing:1px;line-height:1.15;white-space:nowrap;}

  /* ============ 题面 ============ */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px;min-height:0;}
  .card{
    background:linear-gradient(160deg,#fffdf8 0%,#fff3dd 100%);
    border:3px solid #fff;border-radius:24px;
    box-shadow:0 8px 22px rgba(140,95,25,.16);
    padding:18px 16px;text-align:center;
  }
  .card .ask{font-size:13px;color:#a9824a;letter-spacing:1px;}
  .card .src{
    margin-top:8px;font-size:15px;font-weight:900;color:#8a5a12;letter-spacing:1px;
    background:rgba(247,200,115,.35);display:inline-block;padding:3px 12px;border-radius:20px;
  }
  .card .line{
    margin-top:14px;font-size:25px;font-weight:900;color:#4a330e;line-height:1.7;
    letter-spacing:2px;word-break:break-all;
  }
  .card .line .blank{
    display:inline-block;min-width:1.5em;padding:0 6px;margin:0 2px;
    border-bottom:4px solid #f0a832;color:#d88a12;background:rgba(255,225,160,.5);
    border-radius:8px;font-size:1.15em;
  }
  .card .hint{margin-top:10px;font-size:12px;color:#b08a55;}

  /* ============ 选项：四个大字方块 ============ */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt{
    position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#fff;border:3px solid #f3ddb8;border-radius:18px;
    padding:16px 10px;font-size:30px;font-weight:900;color:#4a330e;
    font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #e8cf9e;
    transition:border-color .15s,background .15s,transform .08s,box-shadow .08s;
  }
  .opt:active:not(.locked){transform:translateY(2px);box-shadow:0 3px 0 #e8cf9e;}
  .opt .k{
    position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;
    background:#f8ecd6;color:#a9824a;font-size:12px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.ok{background:#e8fff0;border-color:#4ecb71;box-shadow:0 5px 0 #a9e8bd;}
  .opt.ok .k{background:#4ecb71;color:#fff;}
  .opt.bad{background:#fff0f0;border-color:#ff7b7b;box-shadow:0 5px 0 #ffc4c4;}
  .opt.bad .k{background:#ff7b7b;color:#fff;}
  .opt .mark{position:absolute;right:12px;top:10px;font-size:20px;}
  .opt.locked{cursor:default;}

  /* ============ 弹层 ============ */
  .mask{
    position:absolute;inset:0;background:rgba(72,45,12,.45);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:20;
  }
  .mask.show{display:flex;}
  .panel{
    width:100%;max-width:410px;background:#fff;border-radius:24px;
    padding:20px 18px;box-shadow:0 18px 40px rgba(60,38,10,.34);
    animation:pop .22s ease-out;overflow:hidden;
  }
  @keyframes pop{from{transform:scale(.86);opacity:0;}to{transform:scale(1);opacity:1;}}
  .panel h2{font-size:20px;color:#8a5a12;text-align:center;letter-spacing:1px;}
  .panel .sub{text-align:center;font-size:13px;color:#a9824a;margin-top:6px;}
  .sol-line{
    margin:14px 0 10px;text-align:center;font-size:24px;font-weight:900;
    color:#4a330e;letter-spacing:2px;line-height:1.7;word-break:break-all;
  }
  .sol-line .hl{color:#2f9f57;}
  .sol-line .hl.bad{color:#e04545;}
  .sol-box{background:#f4fbff;border:2px dashed #b9dcf5;border-radius:16px;padding:12px 14px;}
  .sol-box .lb{font-size:12px;font-weight:900;color:#2f8f5b;letter-spacing:1px;}
  .sol-box .tx{font-size:15px;color:#3b2a10;line-height:1.6;margin-top:4px;}
  .sol-box.warn{background:#fff8f2;border-color:#ffd6b0;margin-top:10px;}
  .sol-box.warn .lb{color:#d97a1a;}
  .stars-big{text-align:center;font-size:34px;letter-spacing:6px;margin:12px 0 4px;}
  .recap{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:hidden;}
  .recap .it{
    background:#f7fbff;border-left:5px solid #7fc4ef;border-radius:10px;padding:9px 11px;
  }
  .recap .it.miss{background:#fff5f5;border-left-color:#ff9a9a;}
  .recap .it .w{font-size:14px;font-weight:900;color:#8a5a12;letter-spacing:1px;}
  .recap .it .w em{font-style:normal;font-size:12px;color:#b08a55;font-weight:400;margin-left:6px;}
  .recap .it .d{font-size:13px;color:#7a4e0b;margin-top:3px;line-height:1.5;}
  .recap .it .d b{color:#2f9f57;}
  .recap .it.miss .d b{color:#e04545;}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .btn{
    border:none;border-radius:40px;padding:14px 18px;font-size:17px;font-weight:900;
    font-family:inherit;letter-spacing:1px;cursor:pointer;
  }
  .btn.primary{background:linear-gradient(135deg,#ffd166,#f0a832);color:#6b3d00;box-shadow:0 5px 0 #d98b00;}
  .btn.ghost{background:#f8f1e4;color:#8a6a35;box-shadow:0 5px 0 #e6d5b5;}
  .btn:active{transform:translateY(3px);box-shadow:none;}

  /* 星星动效 */
  .fly{position:absolute;font-size:26px;pointer-events:none;z-index:30;animation:fly .85s ease-out forwards;}
  @keyframes fly{
    0%{opacity:1;transform:translate(0,0) scale(.7);}
    100%{opacity:0;transform:translate(0,-110px) scale(1.5);}
  }
  .shake{animation:shake .32s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}75%{transform:translateX(-4px);}
  }
</style>
</head>
<body>
<div id="viewport">
<div id="app">
  <div class="hud">
    <button class="icon-btn" id="btnBack" aria-label="返回">‹</button>
    <div class="hud-mid">
      <div class="t">古诗文默写</div>
      <div class="q" id="qidx">第 1 / 3 题</div>
    </div>
    <div class="counters">
      <div class="row-icons" id="hudStars">⭐️⭐️⭐️</div>
      <div class="row-icons" id="hudHearts">❤️❤️❤️</div>
    </div>
  </div>

  <div class="stage">
    <div class="card">
      <div class="ask">补全诗文，选出正确的字</div>
      <div class="src" id="src">《——》</div>
      <div class="line" id="line">——</div>
      <div class="hint">四个字长得很像，仔细看哦</div>
    </div>
    <div class="options" id="options"></div>
  </div>

  <div class="mask" id="mask">
    <!-- 解析 -->
    <div class="panel" id="solPanel" style="display:none">
      <h2 id="solTitle">差一点点！</h2>
      <div class="sol-line" id="solLine">—</div>
      <div class="sol-box">
        <div class="lb">✔ 正确的字</div>
        <div class="tx" id="solCorrect">—</div>
      </div>
      <div class="sol-box warn" id="solWarnBox" style="display:none">
        <div class="lb">✘ 你选的字</div>
        <div class="tx" id="solWrong">—</div>
      </div>
      <div class="btns">
        <button class="btn primary" id="btnNext">下一题 ▶</button>
      </div>
    </div>
    <!-- 结算 -->
    <div class="panel" id="endPanel" style="display:none">
      <h2 id="endTitle">—</h2>
      <div class="sub" id="endSub">—</div>
      <div class="stars-big" id="endStars">⭐️⭐️⭐️</div>
      <div class="recap" id="recap"></div>
      <div class="btns">
        <button class="btn primary" id="btnAgain">🔁 再来一局</button>
        <button class="btn ghost" id="btnQuit">🏠 退出</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>

/* ---------- 音效 ---------- */
let AC = null;
function beep(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = type === "ok" ? [[740, 0], [988, .09], [1319, .18]]
             : type === "bad" ? [[300, 0], [200, .12]]
             : [[659, 0], [784, .1], [988, .2], [1319, .3]];
    seq.forEach(([f, t]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === "bad" ? "sawtooth" : "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, AC.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.16, AC.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + t + .22);
      o.connect(g).connect(AC.destination);
      o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .26);
    });
  } catch (e) {}
}

  line.innerHTML = "";

  parts.forEach((p, i) => {

      b.className = "blank"; b.textContent = "?";

    }
  });
  const box = $("options");

}

    renderHUD();
    beep("bad");
    setTimeout(() => showSolution(), 420);
  }
}

function flyStar(anchor) {
  const app = $("app");
  const r = anchor.getBoundingClientRect();
  const ar = app.getBoundingClientRect();
  const k = ar.width / (app.offsetWidth || VW);
  const s = document.createElement("div");
  s.className = "fly";
  s.textContent = "⭐️";
  s.style.left = ((r.left - ar.left) / k + r.width / k / 2 - 13) + "px";
  s.style.top = ((r.top - ar.top) / k - 6) + "px";
  app.appendChild(s);
  setTimeout(() => s.remove(), 900);
}

/* ---------- 解析弹层 ---------- */
function showSolution() {
  const it = S.cur.item;
  const full = it.text;
  $("solTitle").textContent = S.hearts <= 0 ? "爱心用完啦" : "答错啦，看解析～";
  /* 完整句子里高亮正确字 */
  const line = $("solLine");
  line.innerHTML = "";
  const cidx = full.indexOf(it.correct);
  if (cidx >= 0) {
    line.appendChild(document.createTextNode(full.slice(0, cidx)));
    const s = document.createElement("span");
    s.className = "hl"; s.textContent = it.correct;
    line.appendChild(s);
    line.appendChild(document.createTextNode(full.slice(cidx + it.correct.length)));
  } else {
    line.textContent = full;
  }
  $("solCorrect").textContent = "「" + it.correct + "」 · 《" + it.title + "》";
  const wb = $("solWarnBox");
  wb.style.display = "block";
  $("solWrong").textContent = "你选的是「" + (S.cur.lastPick || "—") + "」，注意区别哦";
  $("btnNext").textContent = (S.hearts <= 0 || S.idx + 1 >= ROUND_SIZE) ? "看看结果 ▶" : "下一题 ▶";
  $("mask").classList.add("show");
  $("solPanel").style.display = "block";
  $("endPanel").style.display = "none";
  fit();
}

function advance() {
  S.idx++;
  if (S.hearts <= 0) return finish();
  if (S.idx >= ROUND_SIZE) return finish();
  renderQuestion();
}

/* ---------- 结算：显示正确答案跟错误答案 ---------- */
function finish() {
  $("mask").classList.add("show");
  $("solPanel").style.display = "none";
  $("endPanel").style.display = "block";
  const st = S.stars, miss = S.log.filter(x => x.miss).length;
  let title, sub;
  if (st >= 3) { title = "🏆 完美通关！"; sub = "三题全对，三颗星全拿到啦"; }
  else if (st === 2) { title = "🎉 通关成功！"; sub = "就差一点点，可以更棒哦"; }
  else if (st === 1) { title = "💪 再练一练～"; sub = "记住刚才的解析，下一局会更好"; }
  else { title = "😢 挑战失败"; sub = "三颗爱心用完啦，再来一局吧"; }
  if (st < 3 && miss >= 3) sub = "三颗爱心用完啦，再来一局吧";
  $("endTitle").textContent = title;
  $("endSub").textContent = sub;
  $("endStars").textContent = hudStars();
  const box = $("recap");
  box.innerHTML = "";
  S.log.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "it" + (it.miss ? " miss" : "");
    const w = document.createElement("div");
    w.className = "w";
    w.textContent = "《" + it.title + "》";
    const em = document.createElement("em");
    em.textContent = it.miss ? "答错了" : "答对了";
    w.appendChild(em);
    const t = document.createElement("div");
    t.className = "d";
    t.innerHTML = (it.miss ? "✘ 你选错了，正确字是 <b>" + it.correct + "</b>" : "✔ 答对了，正确字是 <b>" + it.correct + "</b>");
    d.appendChild(w); d.appendChild(t);
    box.appendChild(d);
  });
  beep(st >= 2 ? "win" : "bad");
  fit();
}

/* ---------- 开局 ---------- */
function newRound() {
  S = { stars: 0, hearts: MAX_HEART, idx: 0, qs: [], cur: null, locked: false, log: [] };
  for (let i = 0; i < ROUND_SIZE; i++) S.qs.push(buildQuestion(drawItem()));
  $("mask").classList.remove("show");
  renderQuestion();
  fit();
}

/* ---------- 事件 ---------- */
$("btnNext").addEventListener("click", () => {
  $("mask").classList.remove("show");
  advance();
});
$("btnAgain").addEventListener("click", newRound);
$("btnQuit").addEventListener("click", () => { location.href = HOME_URL; });
$("btnBack").addEventListener("click", () => { location.href = HOME_URL; });

document.addEventListener("keydown", e => {
  if ($("mask").classList.contains("show")) {
    if (e.key === "Enter") { ($("endPanel").style.display === "block") ? newRound() : $("btnNext").click(); }
    return;
  }
  const map = { "1": 0, "a": 0, "A": 0, "2": 1, "b": 1, "B": 1, "3": 2, "c": 2, "C": 2, "4": 3, "d": 3, "D": 3 };
  if (map[e.key] !== undefined) {
    const b = document.querySelectorAll(".opt")[map[e.key]];
    if (b) b.click();
  }
});

/* ---------- 全屏适配：整页等比缩放居中，永不滚动、永不截断 ---------- */
function fit() {
  const app = $("app");
  const vw = window.innerWidth, vh = window.innerHeight;
  let panelNeed = 0;
  ["solPanel", "endPanel"].forEach(id => {
    const p = $(id);
    if (p && p.style.display !== "none") panelNeed = Math.max(panelNeed, p.offsetHeight + 44);
  });
  const needH = Math.max(VH, app.scrollHeight, panelNeed);
  const s = Math.min(vw / VW, vh / needH);
  app.style.transform = "scale(" + s + ")";
}

newRound();

$("viewport").addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 120));
document.addEventListener("DOMContentLoaded", fit);
fit();
setTimeout(fit, 60);
</script>
