: "苍山负雪", "correct": "明烛天南", "wrongs": ["明浊天南", "明触天南", "明独天南"], "ch": "烛"}, {"title": "蜀相", "src": "杜甫", "prompt": "映阶碧草自春色", "correct": "隔叶黄鹂空好音", "wrongs": ["隔叶黄丽空好音", "隔叶黄犁空好音", "隔叶黄黎空好音"], "ch": "鹂"}, {"title": "蜀相", "src": "杜甫", "prompt": "出师未捷身先死", "correct": "长使英雄泪满襟", "wrongs": ["长使英雄泪满矜", "长使英雄泪满禁", "长使英雄泪满噤"], "ch": "襟"}, {"title": "送瘟神（其一）", "src": "毛泽东", "prompt": "绿水青山枉自多", "correct": "华佗无奈小虫何", "wrongs": ["华驼无奈小虫何", "华驮无奈小虫何", "华坨无奈小虫何"], "ch": "佗"}, {"title": "送瘟神（其一）", "src": "毛泽东", "prompt": "", "correct": "千村薜荔人遗矢", "wrongs": ["千村劈荔人遗矢", "千村臂荔人遗矢", "千村璧荔人遗矢"], "ch": "薜"}, {"title": "送瘟神（其二）", "src": "毛泽东", "prompt": "春风杨柳万千条", "correct": "六亿神州尽舜尧", "wrongs": ["六亿神州尽舜饶", "六亿神州尽舜浇", "六亿神州尽舜骁"], "ch": "尧"}, {"title": "送瘟神（其二）", "src": "毛泽东", "prompt": "借问瘟君欲何往", "correct": "纸船明烛照天烧", "wrongs": ["纸船明浊照天烧", "纸船明触照天烧", "纸船明独照天烧"], "ch": "烛"}];
const TOTAL = 3;
const app = document.getElementById('app');
const elQ = document.getElementById('qPrompt');
const elBlank = document.getElementById('qBlank');
const elOpts = document.getElementById('opts');
const elNum = document.getElementById('qNum');
const elTitle = document.getElementById('qTitle');
const elAuthor = document.getElementById('qAuthor');
const mask = document.getElementById('mask');
const panelTitle = document.getElementById('panelTitle');
const solCorrect = document.getElementById('solCorrect');
const solWrongRow = document.getElementById('solWrongRow');
const solWrong = document.getElementById('solWrong');
const panelTip = document.getElementById('panelTip');
const btnNext = document.getElementById('btnNext');
const game = document.getElementById('game');
const result = document.getElementById('result');
const resGood = document.getElementById('resGood');
const resScore = document.getElementById('resScore');
const resList = document.getElementById('resList');

let round = [];      // 本局题目
let qIdx = 0;
let good = 0;
let records = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestion(){
  const pool = BANK.slice();
  const picked = [];
  while(picked.length < TOTAL && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }
  return picked;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderQuestion(){
  const q = round[qIdx];
  elNum.textContent = qIdx+1;
  elTitle.textContent = q.title;
  elAuthor.textContent = q.src;
  if(q.prompt){ elQ.style.display=''; elQ.textContent = q.prompt; }
  else { elQ.style.display='none'; elBlank.textContent = '请补全《'+q.title+'》中的名句'; elBlank.style.borderStyle='dashed'; }
  // 选项：正确 + 3 干扰，打乱
  const opts = shuffle([q.correct].concat(q.wrongs));
  elOpts.innerHTML = '';
  opts.forEach(txt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = txt;
    b.dataset.txt = txt;
    b.addEventListener('click', () => choose(b, txt, q));
    elOpts.appendChild(b);
  });
}

function choose(btn, txt, q){
  const btns = elOpts.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const isOk = txt === q.correct;
  // 高亮字
  function hl(s, target, cls){ return esc(s).replace(target, '<span class="'+cls+'">'+esc(target)+'</span>'); }
  const diff = q.ch; // 考察字
  if(isOk){
    good++;
    btn.classList.add('ok');
    btn.innerHTML = hl(txt, diff, 'hl-ok');
    btns.forEach(b => { if(b!==btn) b.classList.add('dim'); });
    records.push({q:q, ok:true, pick:txt});
    setTimeout(()=>{ next(); }, 900);
  } else {
    btn.classList.add('bad');
    btn.innerHTML = hl(txt, diff, 'hl-bad');
    btns.forEach(b => { if(b!==btn && b.dataset.txt===q.correct){ b.classList.add('ok'); b.innerHTML = hl(q.correct, diff, 'hl-ok'); } });
    records.push({q:q, ok:false, pick:txt});
    showPanel(false, btn, q);
  }
}

function showPanel(ok, btn, q){
  panelTitle.textContent = ok ? '回答正确！' : '回答错误';
  panelTitle.className = ok ? 'correct' : 'wrong';
  solCorrect.innerHTML = '正确答案：'.replace('正确答案：','') ;
  solCorrect.innerHTML = esc(q.correct).replace(q.ch, '<span class="hl-ok">'+esc(q.ch)+'</span>');
  if(ok){
    solWrongRow.style.display = 'none';
  } else {
    solWrongRow.style.display = '';
    solWrong.innerHTML = esc(q.pick).replace(q.ch, '<span class="hl-bad">'+esc(q.ch)+'</span>');
    if(!q.pick.includes(q.ch)) solWrong.innerHTML = esc(q.pick);
  }
  panelTip.textContent = '《'+q.title+'》· '+q.src+' 中应为「'+q.ch+'」，注意与形近字区分。';
  btnNext.textContent = (qIdx+1 >= round.length) ? '查看结算 →' : '下一题 →';
  mask.classList.add('show');
}

function next(){
  mask.classList.remove('show');
  qIdx++;
  if(qIdx >= round.length){ showResult(); return; }
  renderQuestion();
}

function showResult(){
  game.style.display = 'none';
  result.classList.add('show');
  resGood.textContent = good;
  resScore.textContent = good + '/' + TOTAL;
  resList.innerHTML = '';
  records.forEach((r,i)=>{
    const div = document.createElement('div');
    div.className = 'res-item';
    const mark = r.ok ? '<span class="res-mark good">✓ 正确</span>' : '<span class="res-mark bad">✗ 错误</span>';
    const ans = esc(r.q.correct).replace(r.q.ch, '<span class="hl-ok">'+esc(r.q.ch)+'</span>');
    div.innerHTML = '<div class="res-head"><span>'+(i+1)+'. 《'+r.q.title+'》</span>'+mark+'</div>'+
      '<div class="res-src">'+r.q.src+'</div><div class="res-ans">'+ans+'</div>';
    resList.appendChild(div);
  });
}

document.getElementById('btnAgain').addEventListener('click', ()=>{
  result.classList.remove('show');
  game.style.display = '';
  start();
});
document.getElementById('btnExit').addEventListener('click', ()=>{
  if(window.gameExit) gameExit(); else { game.style.display=''; result.classList.remove('show'); start(); }
});
document.getElementById('btnBack').addEventListener('click', ()=>{
  if(window.gameExit) gameExit();
});
btnNext.addEventListener('click', ()=>{
  if(btnNext.textContent.indexOf('结算')>=0){ mask.classList.remove('show'); showResult(); }
  else next();
});

function start(){
  qIdx = 0; good = 0; records = [];
  round = pickQuestion();
  renderQuestion();
}
start();

/* 全屏等比缩放 */
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/900, vh/860);
  app.style.transform = 'scale('+scale+')';
}
window.addEventListener('resize', fit);
fit();
</script>
