<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小游戏乐园</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:linear-gradient(165deg,#6fc1ff 0%,#cfefff 45%,#c9f0cf 100%);
    min-height:100vh; padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);
    user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center;
  }
  .head { text-align:center; margin-bottom:18px; }
  .head h1 { font-size:28px; color:#0f4c81; letter-spacing:2px; text-shadow:0 2px 0 rgba(255,255,255,.7); }
  .head p { margin-top:6px; font-size:13px; color:#4a7ba6; }
  .stage { width:100%; max-width:520px; }

  /* ===== 顶部大格子 ===== */
  .hero {
    position:relative; display:block; width:100%; border-radius:24px; overflow:hidden;
    padding:22px 20px; text-decoration:none; cursor:pointer;
    background:linear-gradient(135deg,#ffd166 0%,#ffb347 55%,#ff9a1f 100%);
    box-shadow:0 10px 0 #d98b00, 0 16px 28px rgba(0,0,0,.18);
    transition:transform .08s, box-shadow .08s; border:3px solid #fff5d6;
  }
  .hero:active { transform:translateY(5px); box-shadow:0 5px 0 #d98b00, 0 8px 16px rgba(0,0,0,.18); }
  .hero .badge { display:inline-block; background:rgba(255,255,255,.85); color:#c0392b;
    font-size:12px; font-weight:800; padding:3px 10px; border-radius:20px; margin-bottom:10px; }
  .hero h2 { font-size:30px; color:#7a3a00; letter-spacing:2px; text-shadow:0 2px 0 rgba(255,255,255,.55); }
  .hero .desc { margin-top:8px; font-size:14px; color:#8a4b00; line-height:1.6; }
  .hero .go { margin-top:14px; display:inline-block; background:#fff; color:#e07b00;
    font-size:17px; font-weight:900; padding:10px 26px; border-radius:40px;
    box-shadow:0 3px 0 rgba(190,110,0,.35); }
  .hero .ico { position:absolute; right:14px; bottom:10px; font-size:64px; opacity:.35; transform:rotate(-12deg); }

  /* ===== 分区标题 ===== */
  .sec { display:flex; align-items:center; gap:8px; margin:24px 4px 12px; }
  .sec .bar { width:5px; height:18px; border-radius:3px; background:#0f4c81; }
  .sec span { font-size:16px; font-weight:800; color:#0f4c81; }
  .sec em { font-style:normal; font-size:12px; color:#5d8bb3; margin-left:auto; }

  /* ===== 下面小格子网格 ===== */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .slot {
    position:relative; border-radius:20px; min-height:132px; padding:16px 14px;
    background:rgba(255,255,255,.55); border:3px dashed rgba(15,76,129,.28);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:#6d97b5; text-align:center;
  }
  .slot .plus { font-size:30px; line-height:1; color:rgba(15,76,129,.35); }
  .slot .t { font-size:14px; font-weight:800; }
  .slot .s { font-size:11px; color:#8fb0c8; }
  .slot.locked { background:rgba(255,255,255,.35); }

  /* 已上线的游戏格 */
  .slot.game {
    display:block; text-decoration:none; cursor:pointer;
    background:linear-gradient(140deg,#a8e6c1 0%,#57c98a 60%,#31b06d 100%);
    border:3px solid #e9fff2; box-shadow:0 8px 0 #1f8c52, 0 14px 22px rgba(0,0,0,.16);
    text-align:left; align-items:flex-start; justify-content:flex-start;
    transition:transform .08s, box-shadow .08s;
  }
  .slot.game:active { transform:translateY(4px); box-shadow:0 4px 0 #1f8c52, 0 8px 14px rgba(0,0,0,.16); }
  .slot.game .tag { display:inline-block; background:rgba(255,255,255,.9); color:#12794a;
    font-size:11px; font-weight:800; padding:2px 9px; border-radius:20px; }
  .slot.game .t { margin-top:10px; font-size:20px; font-weight:900; color:#0c4f31; letter-spacing:1px; }
  .slot.game .s { margin-top:6px; font-size:12px; color:#155f3c; line-height:1.55; }
  .slot.game .ico { position:absolute; right:10px; bottom:6px; font-size:44px; opacity:.3; }
  .foot { margin-top:26px; text-align:center; font-size:12px; color:#6f9cbd; }
</style>
</head>
<body>
  <div class="head">
    <h1>🎮 小游戏乐园</h1>
    <p>点一下卡片，就能开始玩啦</p>
  </div>

  <div class="stage">
    <!-- 顶部大格子：拼音接金币 -->
    <a class="hero" id="game1" href="pinyin-game.html">
      <div class="badge">已上线</div>
      <h2>拼音接金币</h2>
      <div class="desc">接住正确的拼音，集满三颗星！<br>易错字读音大挑战～</div>
      <div class="go">开始游戏 ▶</div>
      <div class="ico">🪙</div>
    </a>

    <div class="sec"><div class="bar"></div><span>更多游戏</span><em>持续更新中</em></div>

    <div class="grid">
      <a class="slot game" href="idiom-game.html">
        <div class="tag">已上线</div>
        <div class="t">成语选释义</div>
        <div class="s">三选一，选出成语的正确意思<br>答错会直接讲给你听</div>
        <div class="ico">📖</div>
      </a>
      <div class="slot">
        <div class="plus">＋</div>
        <div class="t">新游戏</div>
        <div class="s">即将上线</div>
      </div>
      <div class="slot locked">
        <div class="plus">＋</div>
        <div class="t">新游戏</div>
        <div class="s">即将上线</div>
      </div>
      <div class="slot locked">
        <div class="plus">＋</div>
        <div class="t">新游戏</div>
        <div class="s">即将上线</div>
      </div>
    </div>

    <div class="foot">后续新游戏会陆续放进这些格子里～</div>
  </div>
</body>
</html>
